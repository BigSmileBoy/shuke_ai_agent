<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6d98a">
  <title>教师节快乐</title>
  <style>
    :root {
      --cream: #fff8e8;
      --sun: #f6d98a;
      --peach: #f3b57a;
      --coral: #e86b4a;
      --ink: #4a3428;
      --soft: rgba(255, 248, 232, 0.92);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC",
        "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 50% 0%, #fff3c8 0%, var(--sun) 45%, #f0c46a 100%);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      min-height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding:
        max(12px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .hero {
      width: min(100%, 440px);
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rise 0.7s ease-out both;
    }

    .hero img {
      display: block;
      width: 100%;
      max-height: calc(100dvh - 168px);
      max-height: calc(100vh - 168px);
      height: auto;
      object-fit: contain;
      border-radius: 18px;
      box-shadow:
        0 18px 40px rgba(120, 70, 20, 0.22),
        0 2px 0 rgba(255, 255, 255, 0.35) inset;
    }

    .player {
      width: min(100%, 440px);
      margin-top: 14px;
      padding: 14px 16px 16px;
      border-radius: 20px;
      background: var(--soft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(120, 70, 20, 0.16);
      animation: rise 0.7s ease-out 0.12s both;
    }

    .player-title {
      margin: 0 0 14px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .player-name {
      color: var(--coral);
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 0 0.12em;
      background: linear-gradient(180deg, transparent 62%, rgba(232, 107, 74, 0.22) 62%);
      border-radius: 4px;
    }

    .player-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .play-btn {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: var(--coral);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(232, 107, 74, 0.35);
    }

    .play-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .play-btn .icon-pause { display: none; }
    .play-btn.is-playing .icon-play { display: none; }
    .play-btn.is-playing .icon-pause { display: block; }

    .timeline {
      flex: 1 1 auto;
      min-width: 0;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.82rem;
      color: rgba(74, 52, 40, 0.72);
      font-variant-numeric: tabular-nums;
    }

    .seek {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(74, 52, 40, 0.15);
      outline: none;
    }

    .seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--coral);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .seek::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--coral);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    audio { display: none; }

    .glow {
      position: fixed;
      inset: auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
      opacity: 0.35;
      z-index: -1;
      animation: float 6s ease-in-out infinite;
    }

    .glow-a {
      top: -40px;
      left: -60px;
      background: #ffd36a;
    }

    .glow-b {
      right: -50px;
      bottom: 80px;
      background: #ff9b6a;
      animation-delay: -2.5s;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(12px); }
    }

    @media (min-width: 768px) {
      .hero img {
        max-height: min(72vh, 720px);
      }
    }

    @media (max-height: 700px) {
      .hero img {
        max-height: calc(100dvh - 150px);
        max-height: calc(100vh - 150px);
        border-radius: 14px;
      }
      .player {
        padding: 12px 14px 14px;
      }
      .player-title { font-size: 0.98rem; margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <main class="page">
    <div class="hero">
      <img
        src="teachers_day_cartoon_blessing.jpg"
        alt="教师节快乐：孩子捧花向老师致谢"
        width="720"
        height="1080"
        decoding="async"
      >
    </div>

    <section class="player" aria-label="祝福音频">
      <h1 class="player-title">来自<span class="player-name">洪梓昱</span>的教师节祝福</h1>
      <div class="player-bar">
        <button class="play-btn" id="play-btn" type="button" aria-label="播放">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M8 5v14l11-7z"></path>
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
          </svg>
        </button>
        <div class="timeline">
          <div class="time-row">
            <span id="current-label">0:00</span>
            <span id="duration-label">0:19</span>
          </div>
          <input
            class="seek"
            id="seek"
            type="range"
            min="0"
            max="1000"
            value="0"
            step="1"
            aria-label="播放进度"
          >
        </div>
      </div>
      <audio
        id="blessing-audio"
        playsinline
        preload="auto"
        src="hello.mp3"
        data-duration="19.08"
      ></audio>
    </section>
  </main>
  <script>
    (function () {
      var audio = document.getElementById("blessing-audio");
      var playBtn = document.getElementById("play-btn");
      var seek = document.getElementById("seek");
      var currentLabel = document.getElementById("current-label");
      var durationLabel = document.getElementById("duration-label");
      var durationSec = 0;
      var seeking = false;

      function formatTime(sec) {
        var total = Math.max(0, Math.round(Number(sec) || 0));
        var m = Math.floor(total / 60);
        var s = total % 60;
        return m + ":" + String(s).padStart(2, "0");
      }

      function setDuration(sec) {
        sec = Number(sec);
        if (!isFinite(sec) || sec <= 0) return false;
        // Prefer a newly detected longer/finite duration; ignore tiny noise.
        if (durationSec > 0 && Math.abs(durationSec - sec) < 0.01) {
          durationLabel.textContent = formatTime(durationSec);
          return true;
        }
        durationSec = sec;
        durationLabel.textContent = formatTime(sec);
        updateProgress();
        return true;
      }

      function detectDurationFromAudio() {
        var d = audio.duration;
        if (isFinite(d) && d > 0) {
          setDuration(d);
          return;
        }
        // Some WebViews report Infinity until we force a seek.
        if (d === Infinity) {
          try {
            var onTime = function () {
              audio.removeEventListener("timeupdate", onTime);
              if (isFinite(audio.duration) && audio.duration > 0) {
                setDuration(audio.duration);
              }
              try { audio.currentTime = 0; } catch (e) {}
            };
            audio.addEventListener("timeupdate", onTime);
            audio.currentTime = 1e101;
          } catch (e) {}
        }
      }

      function updateProgress() {
        var current = audio.currentTime || 0;
        var total = durationSec;
        if ((!total || total <= 0) && isFinite(audio.duration) && audio.duration > 0) {
          total = audio.duration;
          setDuration(total);
        }
        if (!seeking) {
          currentLabel.textContent = formatTime(current);
          if (total > 0) {
            seek.value = String(Math.min(1000, Math.round((current / total) * 1000)));
          }
        }
      }

      function durationFromMp3(arrayBuffer) {
        var data = new Uint8Array(arrayBuffer);
        var offset = 0;

        if (data.length >= 10 && data[0] === 0x49 && data[1] === 0x44 && data[2] === 0x33) {
          var tagSize =
            ((data[6] & 0x7f) << 21) |
            ((data[7] & 0x7f) << 14) |
            ((data[8] & 0x7f) << 7) |
            (data[9] & 0x7f);
          offset = 10 + tagSize;
          if (data[5] & 0x10) offset += 10;
        }

        var bitrateTable = [
          [0, 0, 0, 0, 0],
          [32, 32, 32, 32, 8],
          [64, 48, 40, 48, 16],
          [96, 56, 48, 56, 24],
          [128, 64, 56, 64, 32],
          [160, 80, 64, 80, 40],
          [192, 96, 80, 96, 48],
          [224, 112, 96, 112, 56],
          [256, 128, 112, 128, 64],
          [288, 160, 128, 144, 80],
          [320, 192, 160, 160, 96],
          [352, 224, 192, 176, 112],
          [384, 256, 224, 192, 128],
          [416, 320, 256, 224, 144],
          [448, 384, 320, 256, 160],
          [0, 0, 0, 0, 0]
        ];
        var sampleRateTable = [
          [11025, 12000, 8000],
          [0, 0, 0],
          [22050, 24000, 16000],
          [44100, 48000, 32000]
        ];

        var totalSamples = 0;
        var sampleRate = 0;
        var firstBitrate = 0;
        var frames = 0;
        var audioStart = offset;
        var guard = 0;

        while (offset < data.length - 4 && guard < 200000) {
          guard += 1;
          if (!(data[offset] === 0xff && (data[offset + 1] & 0xe0) === 0xe0)) {
            offset += 1;
            continue;
          }

          var b1 = data[offset + 1];
          var b2 = data[offset + 2];
          var versionBits = (b1 >> 3) & 0x3;
          var layerBits = (b1 >> 1) & 0x3;
          var bitrateIndex = (b2 >> 4) & 0xf;
          var sampleRateIndex = (b2 >> 2) & 0x3;
          var padding = (b2 >> 1) & 0x1;

          if (versionBits === 1 || layerBits === 0 || bitrateIndex === 0 || bitrateIndex === 15 || sampleRateIndex === 3) {
            offset += 1;
            continue;
          }

          var col;
          if (versionBits === 3) {
            col = layerBits === 3 ? 0 : layerBits === 2 ? 1 : 2;
          } else {
            col = layerBits === 1 ? 4 : 3;
          }

          var bitrate = bitrateTable[bitrateIndex][col] * 1000;
          sampleRate = sampleRateTable[versionBits][sampleRateIndex];
          if (!bitrate || !sampleRate) {
            offset += 1;
            continue;
          }
          if (!firstBitrate) {
            firstBitrate = bitrate;
            audioStart = offset;
          }

          var samplesPerFrame = layerBits === 3 ? 384 : layerBits === 2 ? 1152 : versionBits === 3 ? 1152 : 576;
          var frameLength;
          if (layerBits === 3) {
            frameLength = Math.floor((12 * bitrate) / sampleRate + padding) * 4;
          } else {
            var coeff = versionBits === 3 ? 144 : 72;
            frameLength = Math.floor((coeff * bitrate) / sampleRate) + padding;
          }

          if (frameLength < 1) {
            offset += 1;
            continue;
          }

          if (frames === 0) {
            var channelMode = (data[offset + 3] >> 6) & 0x3;
            var xingOffset =
              offset +
              4 +
              (versionBits === 3 ? (channelMode === 3 ? 17 : 32) : channelMode === 3 ? 9 : 17);
            var tag =
              String.fromCharCode(data[xingOffset], data[xingOffset + 1], data[xingOffset + 2], data[xingOffset + 3]);
            if (tag === "Xing" || tag === "Info") {
              var flags =
                (data[xingOffset + 4] << 24) |
                (data[xingOffset + 5] << 16) |
                (data[xingOffset + 6] << 8) |
                data[xingOffset + 7];
              if (flags & 0x1) {
                var frameCount =
                  (data[xingOffset + 8] << 24) |
                  (data[xingOffset + 9] << 16) |
                  (data[xingOffset + 10] << 8) |
                  data[xingOffset + 11];
                return (frameCount * samplesPerFrame) / sampleRate;
              }
            }
          }

          totalSamples += samplesPerFrame;
          frames += 1;
          offset += frameLength;
        }

        if (frames && sampleRate) return totalSamples / sampleRate;
        // CBR fallback from file size.
        if (firstBitrate > 0) {
          return ((data.length - audioStart) * 8) / firstBitrate;
        }
        return 0;
      }

      function loadDurationByRequest() {
        var url = new URL("hello.mp3", window.location.href).href;
        if (window.fetch) {
          return fetch(url, { credentials: "same-origin", cache: "force-cache" })
            .then(function (res) {
              if (!res.ok) throw new Error("fetch failed");
              return res.arrayBuffer();
            })
            .then(function (buffer) {
              setDuration(durationFromMp3(buffer));
            });
        }
        return new Promise(function (resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.responseType = "arraybuffer";
          xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
              setDuration(durationFromMp3(xhr.response));
              resolve();
            } else {
              reject(new Error("xhr failed"));
            }
          };
          xhr.onerror = reject;
          xhr.send();
        });
      }

      // Immediate fallback from file metadata written into the page.
      setDuration(audio.getAttribute("data-duration"));

      playBtn.addEventListener("click", function () {
        if (audio.paused) {
          audio.play().catch(function () {});
        } else {
          audio.pause();
        }
      });

      audio.addEventListener("play", function () {
        playBtn.classList.add("is-playing");
        playBtn.setAttribute("aria-label", "暂停");
        detectDurationFromAudio();
      });
      audio.addEventListener("pause", function () {
        playBtn.classList.remove("is-playing");
        playBtn.setAttribute("aria-label", "播放");
      });
      audio.addEventListener("ended", function () {
        playBtn.classList.remove("is-playing");
        playBtn.setAttribute("aria-label", "播放");
        audio.currentTime = 0;
        updateProgress();
      });
      audio.addEventListener("loadedmetadata", detectDurationFromAudio);
      audio.addEventListener("durationchange", detectDurationFromAudio);
      audio.addEventListener("canplay", detectDurationFromAudio);
      audio.addEventListener("timeupdate", function () {
        detectDurationFromAudio();
        updateProgress();
      });

      seek.addEventListener("input", function () {
        seeking = true;
        var total = durationSec > 0 ? durationSec : audio.duration;
        if (isFinite(total) && total > 0) {
          currentLabel.textContent = formatTime((Number(seek.value) / 1000) * total);
        }
      });
      seek.addEventListener("change", function () {
        var total = durationSec > 0 ? durationSec : audio.duration;
        if (isFinite(total) && total > 0) {
          audio.currentTime = (Number(seek.value) / 1000) * total;
        }
        seeking = false;
        updateProgress();
      });

      loadDurationByRequest().catch(function () {
        detectDurationFromAudio();
      });
      audio.load();
    })();
  </script>
</body>
</html>
