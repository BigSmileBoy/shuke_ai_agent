<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6d98a">
  <title>教师节快乐</title>
  <style>
    :root {
      --cream: #fff8e8;
      --sun: #f6d98a;
      --peach: #f3b57a;
      --coral: #e86b4a;
      --ink: #4a3428;
      --soft: rgba(255, 248, 232, 0.92);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC",
        "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 50% 0%, #fff3c8 0%, var(--sun) 45%, #f0c46a 100%);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      min-height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding:
        max(12px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .hero {
      width: min(100%, 440px);
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rise 0.7s ease-out both;
    }

    .hero img {
      display: block;
      width: 100%;
      max-height: calc(100dvh - 168px);
      max-height: calc(100vh - 168px);
      height: auto;
      object-fit: contain;
      border-radius: 18px;
      box-shadow:
        0 18px 40px rgba(120, 70, 20, 0.22),
        0 2px 0 rgba(255, 255, 255, 0.35) inset;
    }

    .player {
      width: min(100%, 440px);
      margin-top: 14px;
      padding: 14px 16px 16px;
      border-radius: 20px;
      background: var(--soft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(120, 70, 20, 0.16);
      animation: rise 0.7s ease-out 0.12s both;
    }

    .player-title {
      margin: 0 0 12px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 999px;
    }

    .glow {
      position: fixed;
      inset: auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
      opacity: 0.35;
      z-index: -1;
      animation: float 6s ease-in-out infinite;
    }

    .glow-a {
      top: -40px;
      left: -60px;
      background: #ffd36a;
    }

    .glow-b {
      right: -50px;
      bottom: 80px;
      background: #ff9b6a;
      animation-delay: -2.5s;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(12px); }
    }

    @media (min-width: 768px) {
      .hero img {
        max-height: min(72vh, 720px);
      }
    }

    @media (max-height: 700px) {
      .hero img {
        max-height: calc(100dvh - 150px);
        max-height: calc(100vh - 150px);
        border-radius: 14px;
      }
      .player {
        padding: 12px 14px 14px;
      }
      .player-title { font-size: 0.98rem; margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <main class="page">
    <div class="hero">
      <img
        src="https://cdn.jsdelivr.net/gh/BigSmileBoy/shuke_ai_agent@main/happy_teacher_day_AI_audio_QR_code/teachers_day_cartoon_blessing.jpg"
        alt="教师节快乐：孩子捧花向老师致谢"
        width="720"
        height="1080"
        decoding="async"
      >
    </div>

    <section class="player" aria-label="祝福音频">
      <h1 class="player-title">来自洪梓昱的教师节祝福</h1>
      <audio
        controls
        autoplay
        playsinline
        preload="auto"
        src="https://cdn.jsdelivr.net/gh/BigSmileBoy/shuke_ai_agent@main/happy_teacher_day_AI_audio_QR_code/hello.mp3"
      ></audio>
    </section>
  </main>
</body>
</html>
